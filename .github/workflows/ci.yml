name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Mocha test file(s) to run instead of the full suite
        required: false
        default: ''

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - x86
        node:
          - 10
          - 12
          - 14
          - 16
          - 18
          - 19
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - arch: x86
            os: macOS-latest
          - arch: x86
            os: ubuntu-latest
          - arch: x86
            node: 18
            os: windows-latest
          - node: 10
            os: macOS-latest
          - node: 12
            os: macOS-latest
          - node: 14
            os: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.os == 'macOS-latest' && 'arm64' || matrix.arch }}
      - run: npm install
      - run: npm test
        if: inputs.test-filter == ''
      - run: npx mocha --throw-deprecation ${{ inputs.test-filter }}
        if: inputs.test-filter != ''
      - name: Pack the release tarball
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        run: npm pack
      - uses: actions/upload-artifact@v4
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
